name: Build Oberon Browser APKs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Assemble Debug and Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Debug & Release APKs
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace
          else
            gradle assembleDebug assembleRelease --no-daemon --stacktrace
          fi

      - name: Package APKs into Zip
        run: |
          mkdir -p artifacts
          cd app/build/outputs/apk/
          zip -r ../../../../artifacts/oberon-browser-apks.zip . -i "*.apk"
          cd ../../../..
          ls -lh artifacts/

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: oberon-browser-apks.zip
          path: artifacts/oberon-browser-apks.zip
          retention-days: 14
