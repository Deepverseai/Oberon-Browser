name: Build Oberon Browser APKs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble Debug and Release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug and Release APKs
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon 2>&1 | tee gradle-build.log || {
            echo "## ❌ Gradle Build Error Summary" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 100 gradle-build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Package APKs into Zip
        run: |
          mkdir -p artifacts
          cd app/build/outputs/apk/
          zip -r ../../../../artifacts/oberon-browser-apks.zip . -i "*.apk"
          cd ../../../..
          ls -lh artifacts/
          echo "## ✅ Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "Artifact: \`artifacts/oberon-browser-apks.zip\` ($(ls -lh artifacts/oberon-browser-apks.zip | awk '{print $5}'))" >> $GITHUB_STEP_SUMMARY

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: oberon-browser-apks.zip
          path: artifacts/oberon-browser-apks.zip
          retention-days: 14
